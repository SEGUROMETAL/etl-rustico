services:
  clickhouse-server:
    container_name: ch_reportes
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    ports:
      - "${CH_PORT_HTTP:-8123}:8123"
      - "${CH_PORT_NATIVE:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CH_DB:-reportes}
      CLICKHOUSE_USER: ${CH_USER:-${CHUSER}}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-${CHPASSWORD}}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server

volumes:
  clickhouse-data:
  clickhouse-logs:
