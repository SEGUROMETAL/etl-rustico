[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ch"
version = "1.0.0"
description = "Pipelines MySQL legacy -> ClickHouse para dashboards de Superset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=0.10.0",
    "polars>=1.35.2",
    "pyarrow>=22.0.0",
    "pymysql>=1.1.2",
    "sqlalchemy>=2.0.44",
    "python-dotenv>=1.2.1",
    "rich>=14.3.3",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.0.0",
    "ruff>=0.14.13",
]

[project.scripts]
ch = "ch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ch"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
